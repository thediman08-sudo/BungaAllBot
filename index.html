<!DOCTYPE html>
<html>
<head>
  <title>Web Kak</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      color: #333;
      padding: 50px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 20px #0003;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: #ff6f91;
      color: white;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Halo, ini web Kak 😆</h1>
    <p>Dibuat dari HP bersama Bunga 🌼</p>
    <button onclick="alert('Bibik pelit hadir 😆')">Klik aku</button>
  </div>
</body>
</html>
